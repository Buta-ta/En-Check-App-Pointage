org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Certains plugins (tflite_flutter, etc.) compilent leur Kotlin et leur Java
# avec des cibles JVM différentes : Gradle refuse par défaut (« Inconsistent
# JVM-target »). Ce réglage transforme ce refus en simple avertissement.
kotlin.jvm.target.validation.mode=warning
