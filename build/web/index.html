<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#8B6914">
  <title>En-Check</title>

  <!-- Sans ce lien, le navigateur ne propose jamais « Installer l'application ». -->
  <link rel="manifest" href="manifest.json">

  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    Fallback HTML affiché pendant le téléchargement du moteur Flutter.
    Il n'affiche volontairement aucune progression en pourcentage : la vraie
    animation de démarrage (high-five + logo) prend le relais dès le premier
    rendu Flutter.
  -->
  <div id="encheck-splash" role="status" aria-label="Démarrage de l’application">
    <img
      class="encheck-splash-logo"
      src="assets/assets/logo_encheck.png"
      alt=""
      aria-hidden="true"
    >
    <div class="encheck-splash-marque">En-Check</div>
    <div class="encheck-splash-soustitre">Pointage</div>
    <div class="encheck-splash-chargement" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    <div class="encheck-splash-message">Démarrage…</div>
  </div>

  <script>
    (function () {
      var splash = document.getElementById('encheck-splash');
      if (!splash) return;

      var retire = false;
      function masquer() {
        if (retire) return;
        retire = true;
        splash.classList.add('encheck-splash-sortie');
        window.setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 500);
      }

      // Le widget Flutter animé est déjà peint derrière ce fallback.
      window.addEventListener('flutter-first-frame', function () {
        window.setTimeout(masquer, 120);
      }, { once: true });

      // Filet de sécurité si Flutter ne démarre jamais.
      window.setTimeout(masquer, 20000);
    })();
  </script>

  <!-- Un seul chargement de l'application. -->
  <script src="main.dart.js" type="application/javascript"></script>
</body>
</html>
