# ═══════════════════════════════════════════════════════════
#  PUBLIER LA PWA DE TEST (GitHub Pages)
# ═══════════════════════════════════════════════════════════
#
#  CE QUE FAIT CE FICHIER
#  ----------------------
#  Compile la PWA (site web) d'une Pull Request et la publie sur un
#  SITE DE TEST GitHub Pages, SÉPARÉ du site officiel hébergé sur
#  Vercel. Le site officiel n'est jamais touché par ce workflow.
#
#  Site de test : https://buta-ta.github.io/En-Check-App-Pointage/
#  (il montre toujours la dernière compilation de test publiée).
#
#  QUAND IL SE DÉCLENCHE
#  ---------------------
#  • À la main : onglet « Actions » → « Publier la PWA de test » →
#    « Run workflow ».
#  • Sur une Pull Request portant l'étiquette « web-test ».
#
#  POURQUOI ?
#  ----------
#  Une compilation verte ne prouve pas que la PWA fonctionne : le
#  fondateur doit pouvoir ouvrir et installer la version de la PR
#  sur ordinateur avant validation.
# ═══════════════════════════════════════════════════════════

name: Publier la PWA de test

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-test
  cancel-in-progress: false

jobs:
  web-test:
    # Une PR ne publie QUE si elle porte l'étiquette « web-test » ;
    # un lancement manuel publie toujours.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'web-test')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Télécharger les bibliothèques
        run: flutter pub get

      # Le base-href correspond au chemin du site GitHub Pages du projet
      # (buta-ta.github.io/En-Check-App-Pointage/).
      # Même discipline que build-web.yml : on vide d'abord build/web
      # (l'ancien build est commité pour Vercel et contient des fichiers
      # qui faussent une nouvelle compilation), et en cas d'échec le
      # diagnostic est remonté dans les annotations — un échec muet ne
      # sert personne.
      - name: Compiler la PWA de test
        run: |
          rm -rf build/web
          set +e
          flutter build web --release --base-href /En-Check-App-Pointage/ 2>&1 | tee /tmp/build-web.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Compilation PWA de test échouée (code $status) — diagnostic :"
            sed 's/\x1b\[[0-9;]*[mK]//g' /tmp/build-web.log | sed 's/^\[[^]]*\] //' > /tmp/build-web-propre.log
            {
              grep -ni "error" /tmp/build-web-propre.log | head -n 16
              grep -n "lib/" /tmp/build-web-propre.log | head -n 16
              tail -n 25 /tmp/build-web-propre.log
            } | sed 's/%/%25/g' | while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::error::$line"; fi
            done
            exit "$status"
          fi

      - name: Préparer la publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Publier sur le site de test
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Compte rendu
        run: |
          echo "### PWA de test publiée" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Site de test : https://buta-ta.github.io/En-Check-App-Pointage/" >> "$GITHUB_STEP_SUMMARY"
          echo "(la version officielle sur Vercel n'est pas touchée)" >> "$GITHUB_STEP_SUMMARY"
